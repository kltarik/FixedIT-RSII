services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-CU12-ubuntu-22.04
    environment:
      SA_PASSWORD: "${DB_SA_PASSWORD}"
      ACCEPT_EULA: "Y"
    ports: ["1433:1433"]
    volumes: ["sqldata:/var/opt/mssql"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"$$SA_PASSWORD\" -Q \"SELECT 1\" -b -o /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  rabbitmq:
    image: rabbitmq:3.13.1-management
    ports: ["5672:5672", "15672:15672"]
    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_USER}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASS}"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  fixedit-api:
    build:
      context: ./backend
      dockerfile: FixedIT.API/Dockerfile
    ports: ["5000:8080"]
    volumes: ["uploads:/app/uploads"]
    environment:
      ConnectionStrings__DefaultConnection: "Server=sqlserver;Database=200112;User Id=sa;Password=${DB_SA_PASSWORD};TrustServerCertificate=True"
      SeedData__AdminEmail: "${SEED_ADMIN_EMAIL}"
      SeedData__AdminPassword: "${SEED_ADMIN_PASSWORD}"
      SeedData__DefaultUserPassword: "${SEED_USER_PASSWORD}"
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Port: "5672"
      RabbitMQ__Username: "${RABBITMQ_USER}"
      RabbitMQ__Password: "${RABBITMQ_PASS}"
      RabbitMQ__DeliveryRetryDelaysSeconds__0: "1"
      RabbitMQ__DeliveryRetryDelaysSeconds__1: "2"
      RabbitMQ__DeliveryRetryDelaysSeconds__2: "4"
      RabbitMQ__DeliveryRetryDelaysSeconds__3: "8"
      Jwt__Key: "${JWT_KEY}"
      Jwt__Issuer: "FixedIT"
      Jwt__Audience: "FixedITUsers"
      PayPal__ClientId: "${PAYPAL_CLIENT_ID}"
      PayPal__ClientSecret: "${PAYPAL_CLIENT_SECRET}"
      PayPal__BaseUrl: "${PAYPAL_BASE_URL}"
      PayPal__WebhookId: "${PAYPAL_WEBHOOK_ID}"
      PayPal__ReturnUrl: "${PAYPAL_RETURN_URL}"
      PayPal__CancelUrl: "${PAYPAL_CANCEL_URL}"
      PayPal__Currency: "${PAYPAL_CURRENCY}"
      PayPal__RequestTimeoutSeconds: "${PAYPAL_TIMEOUT_SECONDS}"
      Smtp__Host: "${SMTP_HOST}"
      Smtp__Port: "587"
      Smtp__Username: "${SMTP_USERNAME}"
      Smtp__Password: "${SMTP_PASSWORD}"
      Smtp__UseSsl: "${SMTP_USE_SSL:-false}"
    restart: on-failure
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  fixedit-notifications:
    build:
      context: ./backend
      dockerfile: FixedIT.NotificationService/Dockerfile
    environment:
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Port: "5672"
      RabbitMQ__Username: "${RABBITMQ_USER}"
      RabbitMQ__Password: "${RABBITMQ_PASS}"
      RabbitMQ__DeliveryRetryDelaysSeconds__0: "1"
      RabbitMQ__DeliveryRetryDelaysSeconds__1: "2"
      RabbitMQ__DeliveryRetryDelaysSeconds__2: "4"
      RabbitMQ__DeliveryRetryDelaysSeconds__3: "8"
      Smtp__Host: "${SMTP_HOST}"
      Smtp__Port: "${SMTP_PORT:-1025}"
      Smtp__Username: "${SMTP_USERNAME}"
      Smtp__Password: "${SMTP_PASSWORD}"
      Smtp__UseSsl: "${SMTP_USE_SSL:-false}"
      Smtp__FromAddress: "${SMTP_FROM_ADDRESS:-noreply@fixedit.local}"
      Smtp__FromName: "${SMTP_FROM_NAME:-FixedIT}"
    restart: on-failure
    depends_on:
      rabbitmq:
        condition: service_healthy
      mailhog:
        condition: service_healthy

  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports: ["1025:1025", "8025:8025"]
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8025"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  sqldata:
  uploads:
