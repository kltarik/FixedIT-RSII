services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-CU12-ubuntu-22.04
    environment:
      SA_PASSWORD: "${DB_SA_PASSWORD}"
      ACCEPT_EULA: "Y"
    ports: ["1433:1433"]
    volumes: ["sqldata:/var/opt/mssql"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"$$SA_PASSWORD\" -Q \"SELECT 1\" -b -o /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  rabbitmq:
    image: rabbitmq:3.13.1-management
    ports: ["5672:5672", "15672:15672"]
    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_USER}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASS}"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  fixedit-api:
    build:
      context: ./backend
      dockerfile: FixedIT.API/Dockerfile
    ports: ["5000:8080"]
    volumes: ["uploads:/app/uploads"]
    environment:
      ConnectionStrings__DefaultConnection: "Server=${DB_HOST},${DB_PORT};Database=${DB_NAME};User Id=${DB_USER};Password=${DB_SA_PASSWORD};TrustServerCertificate=True"
      SeedData__AdminEmail: "${SEED_ADMIN_EMAIL}"
      SeedData__AdminPassword: "${SEED_ADMIN_PASSWORD}"
      SeedData__DefaultUserPassword: "${SEED_USER_PASSWORD}"
      RabbitMQ__Host: "${RABBITMQ_HOST}"
      RabbitMQ__Port: "${RABBITMQ_PORT}"
      RabbitMQ__Username: "${RABBITMQ_USER}"
      RabbitMQ__Password: "${RABBITMQ_PASS}"
      RabbitMQ__VirtualHost: "${RABBITMQ_VIRTUAL_HOST}"
      RabbitMQ__ExchangeName: "${RABBITMQ_EXCHANGE_NAME}"
      RabbitMQ__QueueName: "${RABBITMQ_QUEUE_NAME}"
      RabbitMQ__RoutingKey: "${RABBITMQ_ROUTING_KEY}"
      RabbitMQ__DeadLetterExchangeName: "${RABBITMQ_DEAD_LETTER_EXCHANGE_NAME}"
      RabbitMQ__DeadLetterQueueName: "${RABBITMQ_DEAD_LETTER_QUEUE_NAME}"
      RabbitMQ__DeadLetterRoutingKey: "${RABBITMQ_DEAD_LETTER_ROUTING_KEY}"
      RabbitMQ__ConnectionRetrySeconds: "${RABBITMQ_CONNECTION_RETRY_SECONDS}"
      RabbitMQ__PrefetchCount: "${RABBITMQ_PREFETCH_COUNT}"
      RabbitMQ__PublishConfirmTimeoutSeconds: "${RABBITMQ_PUBLISH_CONFIRM_TIMEOUT_SECONDS}"
      RabbitMQ__OutboxPollingSeconds: "${RABBITMQ_OUTBOX_POLL_SECONDS}"
      RabbitMQ__OutboxBatchSize: "${RABBITMQ_OUTBOX_BATCH_SIZE}"
      RabbitMQ__DeliveryRetryDelaysSeconds__0: "${RABBITMQ_RETRY_DELAY_0_SECONDS}"
      RabbitMQ__DeliveryRetryDelaysSeconds__1: "${RABBITMQ_RETRY_DELAY_1_SECONDS}"
      RabbitMQ__DeliveryRetryDelaysSeconds__2: "${RABBITMQ_RETRY_DELAY_2_SECONDS}"
      RabbitMQ__DeliveryRetryDelaysSeconds__3: "${RABBITMQ_RETRY_DELAY_3_SECONDS}"
      Jwt__Key: "${JWT_KEY}"
      Jwt__Issuer: "${JWT_ISSUER}"
      Jwt__Audience: "${JWT_AUDIENCE}"
      Jwt__ExpiryHours: "${JWT_EXPIRY_HOURS}"
      Jwt__RefreshTokenExpiryDays: "${JWT_REFRESH_TOKEN_EXPIRY_DAYS}"
      Security__BCryptWorkFactor: "${SECURITY_BCRYPT_WORK_FACTOR}"
      Security__PasswordResetMaxFailedAttempts: "${SECURITY_PASSWORD_RESET_MAX_FAILED_ATTEMPTS}"
      Security__PasswordResetIpPermitLimit: "${SECURITY_PASSWORD_RESET_IP_PERMIT_LIMIT}"
      Security__PasswordResetIpWindowMinutes: "${SECURITY_PASSWORD_RESET_IP_WINDOW_MINUTES}"
      Scheduling__TimeZoneId: "${SCHEDULING_TIME_ZONE_ID}"
      Scheduling__SqlServerTimeZoneId: "${SCHEDULING_SQL_SERVER_TIME_ZONE_ID}"
      PayPal__ClientId: "${PAYPAL_CLIENT_ID}"
      PayPal__ClientSecret: "${PAYPAL_CLIENT_SECRET}"
      PayPal__BaseUrl: "${PAYPAL_BASE_URL}"
      PayPal__WebhookId: "${PAYPAL_WEBHOOK_ID}"
      PayPal__ReturnUrl: "${PAYPAL_RETURN_URL}"
      PayPal__CancelUrl: "${PAYPAL_CANCEL_URL}"
      PayPal__Currency: "${PAYPAL_CURRENCY}"
      PayPal__RequestTimeoutSeconds: "${PAYPAL_TIMEOUT_SECONDS}"
      Pagination__MaxPageSize: "${PAGINATION_MAX_PAGE_SIZE}"
      Pagination__DefaultPageSize: "${PAGINATION_DEFAULT_PAGE_SIZE}"
      Recommendations__Seed: "${RECOMMENDATION_SEED}"
      Recommendations__NumberOfIterations: "${RECOMMENDATION_NUMBER_OF_ITERATIONS}"
      Recommendations__ApproximationRank: "${RECOMMENDATION_APPROXIMATION_RANK}"
      Recommendations__LearningRate: "${RECOMMENDATION_LEARNING_RATE}"
      Recommendations__MinimumTrainingRatings: "${RECOMMENDATION_MINIMUM_TRAINING_RATINGS}"
      Recommendations__RetrainingIntervalHours: "${RECOMMENDATION_RETRAINING_INTERVAL_HOURS}"
      Recommendations__CandidatePoolSize: "${RECOMMENDATION_CANDIDATE_POOL_SIZE}"
      Reports__CompanyName: "${REPORTS_COMPANY_NAME}"
      Reports__QuestPdfLicense: "${REPORTS_QUESTPDF_LICENSE}"
      Reports__MaxPdfRows: "${REPORTS_MAX_PDF_ROWS}"
      FileStorage__RootPath: "${FILE_STORAGE_ROOT_PATH}"
      FileStorage__RequestPath: "${FILE_STORAGE_REQUEST_PATH}"
      FileStorage__MaxFileSizeBytes: "${FILE_STORAGE_MAX_FILE_SIZE_BYTES}"
      FileStorage__AllowedImageMimeTypes__0: "${FILE_STORAGE_ALLOWED_MIME_TYPE_0}"
      FileStorage__AllowedImageMimeTypes__1: "${FILE_STORAGE_ALLOWED_MIME_TYPE_1}"
      AllowedOrigins__0: "${ALLOWED_ORIGIN_0}"
      AllowedOrigins__1: "${ALLOWED_ORIGIN_1}"
    restart: on-failure
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  fixedit-notifications:
    build:
      context: ./backend
      dockerfile: FixedIT.NotificationService/Dockerfile
    environment:
      ConnectionStrings__DefaultConnection: "Server=${DB_HOST},${DB_PORT};Database=${DB_NAME};User Id=${DB_USER};Password=${DB_SA_PASSWORD};TrustServerCertificate=True"
      RabbitMQ__Host: "${RABBITMQ_HOST}"
      RabbitMQ__Port: "${RABBITMQ_PORT}"
      RabbitMQ__Username: "${RABBITMQ_USER}"
      RabbitMQ__Password: "${RABBITMQ_PASS}"
      RabbitMQ__VirtualHost: "${RABBITMQ_VIRTUAL_HOST}"
      RabbitMQ__ExchangeName: "${RABBITMQ_EXCHANGE_NAME}"
      RabbitMQ__QueueName: "${RABBITMQ_QUEUE_NAME}"
      RabbitMQ__RoutingKey: "${RABBITMQ_ROUTING_KEY}"
      RabbitMQ__DeadLetterExchangeName: "${RABBITMQ_DEAD_LETTER_EXCHANGE_NAME}"
      RabbitMQ__DeadLetterQueueName: "${RABBITMQ_DEAD_LETTER_QUEUE_NAME}"
      RabbitMQ__DeadLetterRoutingKey: "${RABBITMQ_DEAD_LETTER_ROUTING_KEY}"
      RabbitMQ__ConnectionRetrySeconds: "${RABBITMQ_CONNECTION_RETRY_SECONDS}"
      RabbitMQ__PrefetchCount: "${RABBITMQ_PREFETCH_COUNT}"
      RabbitMQ__PublishConfirmTimeoutSeconds: "${RABBITMQ_PUBLISH_CONFIRM_TIMEOUT_SECONDS}"
      RabbitMQ__OutboxPollingSeconds: "${RABBITMQ_OUTBOX_POLL_SECONDS}"
      RabbitMQ__OutboxBatchSize: "${RABBITMQ_OUTBOX_BATCH_SIZE}"
      RabbitMQ__DeliveryRetryDelaysSeconds__0: "${RABBITMQ_RETRY_DELAY_0_SECONDS}"
      RabbitMQ__DeliveryRetryDelaysSeconds__1: "${RABBITMQ_RETRY_DELAY_1_SECONDS}"
      RabbitMQ__DeliveryRetryDelaysSeconds__2: "${RABBITMQ_RETRY_DELAY_2_SECONDS}"
      RabbitMQ__DeliveryRetryDelaysSeconds__3: "${RABBITMQ_RETRY_DELAY_3_SECONDS}"
      Smtp__Host: "${SMTP_HOST}"
      Smtp__Port: "${SMTP_PORT}"
      Smtp__Username: "${SMTP_USERNAME}"
      Smtp__Password: "${SMTP_PASSWORD}"
      Smtp__UseSsl: "${SMTP_USE_SSL}"
      Smtp__FromAddress: "${SMTP_FROM_ADDRESS}"
      Smtp__FromName: "${SMTP_FROM_NAME}"
      Smtp__DeliveryStatusApiBaseUrl: "${SMTP_DELIVERY_STATUS_API_BASE_URL}"
      Smtp__DeliveryStatusApiTimeoutSeconds: "${SMTP_DELIVERY_STATUS_API_TIMEOUT_SECONDS}"
    restart: on-failure
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mailhog:
        condition: service_healthy

  mailhog:
    image: mailhog/mailhog:v1.0.1
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "chown -R 1000:1000 /maildir && exec su mailhog -c MailHog"
    ports: ["1025:1025", "8025:8025"]
    environment:
      MH_STORAGE: maildir
      MH_MAILDIR_PATH: /maildir
    volumes:
      - mailhogdata:/maildir
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8025"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  sqldata:
  uploads:
  mailhogdata:
